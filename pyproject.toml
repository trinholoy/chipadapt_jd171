[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trinholoy-chipadapt_jd171"
version = "0.1.0"
description = "从输入中抽取数值，计算推理芯片适配工程师·梯度累积与有效批量相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "trinholoy" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://trinholoy.github.io"
Repository = "https://github.com/trinholoy/chipadapt_jd171"
Issues = "https://github.com/trinholoy/chipadapt_jd171/issues"

[project.scripts]
chipadapt_jd171 = "chipadapt_jd171:main"

[tool.setuptools]
py-modules = ["chipadapt_jd171"]
